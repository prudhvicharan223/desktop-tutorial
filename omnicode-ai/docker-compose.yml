version: '3.8'

services:
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: omnicode-ai
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/omnicode-ai
    depends_on:
      - mongodb
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend
    env_file:
      - ./frontend/.env.local
    restart: unless-stopped

  # Sandboxed code execution environment
  code-sandbox:
    image: python:3.11-slim
    volumes:
      - sandbox_tmp:/tmp/sandbox
    command: ["tail", "-f", "/dev/null"]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp/sandbox:size=50m

volumes:
  mongo_data:
  sandbox_tmp:
